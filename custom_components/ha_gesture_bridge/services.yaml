acknowledge:
  name: Acknowledge gesture
  description: >-
    Diagnostic acknowledgment of a fresh gesture. Measures an HA-clock round
    trip without controlling a load or publishing another gesture. Intended for
    receivers with explicitly enabled latency diagnostics.
  fields:
    entity_id:
      name: Gesture control
      required: true
      selector:
        entity:
          integration: ha_gesture_bridge
          domain: event
    bridge_session_id:
      name: Current bridge session
      required: true
      selector:
        text:
    gesture_sequence:
      name: Gesture sequence
      required: true
      selector:
        number:
          min: 1
          max: 9007199254740991
          mode: box
    receiver:
      name: Receiver identity
      required: true
      selector:
        text:
    receiver_received_epoch_ms:
      name: Receiver receive UTC epoch milliseconds
      required: true
      selector:
        number:
          min: 0
          max: 9007199254740991
          mode: box
    receiver_processed_epoch_ms:
      name: Receiver processed UTC epoch milliseconds
      required: true
      selector:
        number:
          min: 0
          max: 9007199254740991
          mode: box
    receiver_forwarded_epoch_ms:
      name: Receiver forwarded UTC epoch milliseconds
      selector:
        number:
          min: 0
          max: 9007199254740991
          mode: box
    receiver_processing_ms:
      name: Receiver processing milliseconds
      required: true
      selector:
        number:
          min: 0
          max: 60000
          mode: box
set_led:
  name: Set status LED
  description: >-
    Set a discovered or explicitly configured status LED color or brightness.
    Color and brightness changes preserve LED behavior unless behavior is explicitly supplied.
    Updates are confirmed from device feedback, never optimistic.
    Does not control a light load or publish a gesture.
  fields:
    entity_id:
      name: Gesture control
      required: true
      selector:
        entity:
          integration: ha_gesture_bridge
          domain: event
    led_id:
      name: Stable LED channel ID
      required: true
      selector:
        text:
    color:
      name: Color (six hexadecimal digits)
      description: Changes color without changing LED behavior. Black requires explicit always_off behavior; fixed-color LEDs use behavior instead.
      selector:
        text:
    brightness:
      name: LED brightness percentage
      description: Uses supported device brightness levels while preserving power. Standard intensity-only indicators require explicit behavior to change power.
      selector:
        number:
          min: 0
          max: 100
          mode: box
    behavior:
      name: LED behavior
      description: Changes indicator behavior independently of color. Availability depends on the device.
      selector:
        select:
          options:
            - follow_load
            - follow_load_inverted
            - always_on
            - always_off

prepare_device:
  name: Prepare device
  description: Admin-only first-use preparation. Creates or reuses gesture support without operating the device.
  fields:
    device_id:
      required: true
      selector:
        device:
    source_registry_id:
      description: Optional selected load entity registry identity, not an entity ID.
      selector:
        text:

get_devices:
  name: Read device picker
  description: Admin-only read-only device descriptions. Returns only a revision confirmation when the supplied revision is unchanged.
  fields:
    revision:
      selector:
        text:
    page:
      selector:
        number:
          min: 1
          max: 64
