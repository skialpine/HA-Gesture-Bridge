name: Validate gesture integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m tools.validate_gesture_contract
      - run: python tools/build_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: ha-gesture-bridge
          path: dist/ha_gesture_bridge.zip
